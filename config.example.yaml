server:
  host: 0.0.0.0
  port: 8080
onebot:
  url: http://127.0.0.1:3000
llm:
  currentProvider: ds
  providers:
    ds:
      baseUrl: https://api.deepseek.com/v1
      apiKey: ${DEEPSEEK_API_KEY}
      model: deepseek-chat
      temperature: 0.7
storage:
  type: sqlite
  path: data/bot.db
plugins:
  enabled:
    - ai_chat
    - memory
    - rule_match
    - admin
  disabled: []
admin:
  userIds:
    - your-qq-id
  commands:
    - /help
    - /plugins
    - /status
    - /clear
    - /persona
    - /persona-set
    - /persona-reset
context:
  historyLimit: 10
rules: []
memory:
  enabled: false
