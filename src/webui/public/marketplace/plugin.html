<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plugin Detail - NNBot Marketplace</title>
  <link rel="stylesheet" href="css/marketplace.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div class="header-title">
        <span>📦</span>
        <span>Plugin Marketplace</span>
      </div>
      <nav class="header-nav">
        <a href="index.html">Marketplace</a>
        <a href="installed.html">Installed</a>
        <a href="publish.html">Publish</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <!-- Back Button -->
    <a href="index.html" style="display: inline-flex; align-items: center; gap: 8px; margin-bottom: 24px; color: var(--text-secondary);">
      ← Back to Marketplace
    </a>

    <!-- Loading State -->
    <div id="loadingState" class="loading">
      <div class="spinner"></div>
      <span>Loading plugin details...</span>
    </div>

    <!-- Plugin Detail -->
    <div id="pluginDetail" class="plugin-detail" style="display: none;">
      <div class="plugin-detail-header">
        <div class="plugin-detail-icon" id="pluginIcon">📦</div>
        <div class="plugin-detail-info">
          <h1 class="plugin-detail-name" id="pluginName"></h1>
          <div class="plugin-detail-meta">
            <span id="pluginAuthor"></span>
            <span id="pluginVersion"></span>
            <span id="pluginRating"></span>
            <span id="pluginDownloads"></span>
            <span id="pluginLicense"></span>
          </div>
          <div class="plugin-detail-actions">
            <button class="btn btn-primary" id="installBtn">Install</button>
            <button class="btn btn-secondary" id="homepageBtn" style="display: none;">Homepage</button>
            <button class="btn btn-secondary" id="repositoryBtn" style="display: none;">Repository</button>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <div class="tab active" data-tab="description">Description</div>
        <div class="tab" data-tab="readme">README</div>
        <div class="tab" data-tab="versions">Versions</div>
        <div class="tab" data-tab="dependencies">Dependencies</div>
      </div>

      <!-- Tab Contents -->
      <div class="tab-content active" id="descriptionTab">
        <p id="pluginDescription"></p>
      </div>

      <div class="tab-content" id="readmeTab">
        <div id="pluginReadme" style="white-space: pre-wrap;"></div>
      </div>

      <div class="tab-content" id="versionsTab">
        <ul class="versions-list" id="versionsList"></ul>
      </div>

      <div class="tab-content" id="dependenciesTab">
        <div id="dependenciesList"></div>
      </div>
    </div>

    <!-- Error State -->
    <div id="errorState" class="empty-state" style="display: none;">
      <div class="empty-state-icon">⚠️</div>
      <div class="empty-state-text">Plugin not found</div>
      <div class="empty-state-hint">The plugin you're looking for doesn't exist or has been removed.</div>
    </div>
  </main>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script>
    // DOM Elements
    const loadingState = document.getElementById('loadingState');
    const pluginDetail = document.getElementById('pluginDetail');
    const errorState = document.getElementById('errorState');
    const pluginIcon = document.getElementById('pluginIcon');
    const pluginName = document.getElementById('pluginName');
    const pluginAuthor = document.getElementById('pluginAuthor');
    const pluginVersion = document.getElementById('pluginVersion');
    const pluginRating = document.getElementById('pluginRating');
    const pluginDownloads = document.getElementById('pluginDownloads');
    const pluginLicense = document.getElementById('pluginLicense');
    const pluginDescription = document.getElementById('pluginDescription');
    const pluginReadme = document.getElementById('pluginReadme');
    const versionsList = document.getElementById('versionsList');
    const dependenciesList = document.getElementById('dependenciesList');
    const installBtn = document.getElementById('installBtn');
    const homepageBtn = document.getElementById('homepageBtn');
    const repositoryBtn = document.getElementById('repositoryBtn');
    const toastContainer = document.getElementById('toastContainer');

    // Get plugin ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const pluginId = urlParams.get('id');

    // Show toast notification
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      toastContainer.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 3000);
    }

    // Format number
    function formatNumber(num) {
      if (num >= 1000000) {
        return (num / 1000000).toFixed(1) + 'M';
      }
      if (num >= 1000) {
        return (num / 1000).toFixed(1) + 'K';
      }
      return num.toString();
    }

    // Format date
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
      });
    }

    // Load plugin detail
    async function loadPluginDetail() {
      if (!pluginId) {
        showError();
        return;
      }

      try {
        const plugin = await MarketplaceAPI.getPluginDetail(pluginId);

        if (!plugin) {
          showError();
          return;
        }

        renderPlugin(plugin);
        loadVersions(pluginId);
      } catch (err) {
        showError();
        showToast('Failed to load plugin: ' + err.message, 'error');
      }
    }

    // Render plugin detail
    function renderPlugin(plugin) {
      loadingState.style.display = 'none';
      pluginDetail.style.display = 'block';

      pluginIcon.textContent = plugin.icon || '📦';
      pluginName.textContent = plugin.displayName;
      pluginAuthor.textContent = `by ${plugin.author}`;
      pluginVersion.textContent = `v${plugin.version}`;
      pluginRating.textContent = `⭐ ${plugin.rating.toFixed(1)} (${plugin.ratingCount} reviews)`;
      pluginDownloads.textContent = `⬇️ ${formatNumber(plugin.downloads)} downloads`;
      pluginLicense.textContent = plugin.license || 'No license';
      pluginDescription.textContent = plugin.description || 'No description available.';

      if (plugin.readme) {
        pluginReadme.textContent = plugin.readme;
      } else {
        pluginReadme.textContent = 'No README available.';
      }

      if (plugin.homepage) {
        homepageBtn.style.display = 'block';
        homepageBtn.onclick = () => window.open(plugin.homepage, '_blank');
      }

      if (plugin.repository) {
        repositoryBtn.style.display = 'block';
        repositoryBtn.onclick = () => window.open(plugin.repository, '_blank');
      }

      // Render dependencies
      if (plugin.dependencies && plugin.dependencies.length > 0) {
        dependenciesList.innerHTML = `
          <ul style="list-style: none;">
            ${plugin.dependencies.map(dep => `
              <li style="padding: 12px; border-bottom: 1px solid var(--border);">
                <a href="plugin.html?id=${encodeURIComponent(dep.pluginId)}">${dep.pluginId}</a>
                <span style="color: var(--text-muted); margin-left: 8px;">${dep.versionRange}</span>
                ${dep.optional ? '<span style="color: var(--text-muted); margin-left: 8px;">(optional)</span>' : ''}
              </li>
            `).join('')}
          </ul>
        `;
      } else {
        dependenciesList.innerHTML = '<p style="color: var(--text-muted);">No dependencies</p>';
      }
    }

    // Load versions
    async function loadVersions(pluginId) {
      try {
        const versions = await MarketplaceAPI.getVersions(pluginId);

        if (versions.length === 0) {
          versionsList.innerHTML = '<li style="padding: 16px; color: var(--text-muted);">No versions available</li>';
          return;
        }

        versionsList.innerHTML = versions.map(version => `
          <li class="version-item">
            <div>
              <div class="version-info">
                <span class="version-tag">${version.version}</span>
                <span class="version-date">${formatDate(version.releasedAt)}</span>
              </div>
              ${version.changelog ? `<div class="version-changelog">${version.changelog}</div>` : ''}
            </div>
          </li>
        `).join('');
      } catch (err) {
        versionsList.innerHTML = '<li style="padding: 16px; color: var(--error);">Failed to load versions</li>';
      }
    }

    // Show error state
    function showError() {
      loadingState.style.display = 'none';
      errorState.style.display = 'block';
    }

    // Install plugin
    async function installPlugin() {
      try {
        installBtn.disabled = true;
        installBtn.textContent = 'Installing...';

        const result = await MarketplaceAPI.installPlugin(pluginId);

        if (result.success) {
          showToast(result.message);
          installBtn.textContent = 'Installed';
        } else {
          showToast(result.error || 'Installation failed', 'error');
          installBtn.textContent = 'Install';
        }
      } catch (err) {
        showToast('Installation failed: ' + err.message, 'error');
        installBtn.textContent = 'Install';
      } finally {
        installBtn.disabled = false;
      }
    }

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        // Update active tab
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        // Update active content
        document.querySelectorAll('.tab-content').forEach(content => {
          content.classList.remove('active');
        });
        document.getElementById(tab.dataset.tab + 'Tab').classList.add('active');
      });
    });

    // Event Listeners
    installBtn.addEventListener('click', installPlugin);

    // Initialize
    loadPluginDetail();
  </script>
</body>
</html>
