server:
  host: 0.0.0.0
  port: 8080
onebot:
  url: http://127.0.0.1:3000
storage:
  type: sqlite
  path: data/bot.db
context:
  historyLimit: 10
llm:
  currentProvider: ds
  providers:
    ds:
      baseUrl: https://api.deepseek.com/v1
      apiKey: ${LLM_DS_API_KEY}
      model: deepseek-v4-pro
      temperature: 0.7
providers:
  list:
    - id: ds
      type: openai
      baseUrl: https://api.deepseek.com/v1
      apiKey: ${PROVIDER_DS_API_KEY}
      defaultModel: deepseek-v4-pro
      models:
        - id: deepseek-v4-flash
          purpose: both
        - id: deepseek-v4-pro
          purpose: llm
    - id: siliconflow
      type: openai
      baseUrl: https://api.siliconflow.cn/v1
      apiKey: ${PROVIDER_SILICONFLOW_API_KEY}
      defaultModel: BAAI/bge-large-zh-v1.5
  defaults:
    llm:
      providerId: ds
      modelId: deepseek-v4-pro
    vision: {}
    stt: {}
    embedding:
      providerId: siliconflow
      dimension: 1024
plugins:
  enabled:
    - ai_chat
    - memory
    - rule_match
    - admin
    - tools
  disabled: []
admin:
  userIds:
    - "2310410026"
  commands:
    - /help
    - /plugins
    - /status
    - /clear
    - /persona
    - /persona-set
    - /persona-reset
rules: []
memory:
  enabled: true
  embedding:
    providerId: siliconflow
  llm:
    providerId: ds
    model: deepseek-v4-flash
  sqlite:
    path: ./data/memory.db
  search:
    maxMemories: 5
    minScore: 0.3
  lifecycle:
    maxMemoriesPerUser: 500
    summaryTriggerRounds: 15
tools:
  search:
    enabled: true
    provider: duckduckgo
    fallback: duckduckgo
