server:
  host: 0.0.0.0
  port: 8080
onebot:
  url: http://127.0.0.1:3000
wecom:
  enabled: false
  websocketUrl: wss://openws.work.weixin.qq.com
  botId: ${WECOM_BOT_ID}
  secret: ${WECOM_BOT_SECRET}
storage:
  type: sqlite
  path: data/bot.db
workbench:
  enabled: true
  baseUrl: http://127.0.0.1:4177
  timeoutMs: 30000
context:
  historyLimit: 10
llm:
  currentProvider: ds
  providers:
    ds:
      baseUrl: https://api.deepseek.com/v1
      apiKey: ${LLM_DS_API_KEY}
      model: deepseek-v4-pro
      temperature: 0.7
providers:
  list:
    - id: ds
      type: openai
      baseUrl: https://api.deepseek.com/v1
      apiKey: ${PROVIDER_DS_API_KEY}
      defaultModel: deepseek-v4-pro
      models:
        - id: deepseek-v4-flash
          purpose: both
        - id: deepseek-v4-pro
          purpose: llm
    - id: siliconflow
      type: openai
      baseUrl: https://api.siliconflow.cn/v1
      apiKey: ${PROVIDER_SILICONFLOW_API_KEY}
      defaultModel: BAAI/bge-large-zh-v1.5
  defaults:
    llm:
      providerId: ds
      modelId: deepseek-v4-pro
    vision: {}
    stt: {}
    embedding:
      providerId: siliconflow
      dimension: 1024
plugins:
  enabled:
    - ai_chat
    - memory
    - rule_match
    - admin
    - tools
    - workbench
  disabled: []
admin:
  userIds:
    - "YOUR_QQ_USER_ID"
  commands:
    - /help
    - /plugins
    - /status
    - /clear
productManager:
  enabled: true
  # Product-manager analysis is available to all users.
  notification:
    enabled: true
    ownerUserId: ${PRODUCT_MANAGER_OWNER_USER_ID}
    corpId: ${WEWORK_CORP_ID}
    agentId: ${WEWORK_AGENT_ID}
    secret: ${WEWORK_APP_SECRET}
rules: []
memory:
  enabled: true
  embedding:
    providerId: siliconflow
  llm:
    providerId: ds
    model: deepseek-v4-flash
  sqlite:
    path: ./data/memory.db
  search:
    maxMemories: 5
    minScore: 0.3
  lifecycle:
    maxMemoriesPerUser: 500
    summaryTriggerRounds: 15
tools:
  search:
    enabled: true
    provider: duckduckgo
    fallback: duckduckgo
